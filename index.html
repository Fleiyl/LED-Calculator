<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marine Lighting Calculator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Marine Lighting Calculator</h1>

    <!-- Room Dimension -->
    <section>
        <h2>Room Dimension</h2>

        <label>
            Length (m)
            <input type="number" id="length">
        </label>

        <label>
            Width (m)
            <input type="number" id="width">
        </label>

        <label>
            Ceiling Height (m)
            <input type="number" id="ceilingHeight">
        </label>

        <label>
            Working Height (m)
            <input type="number" id="workingHeight">
        </label>
    </section>


    <!-- Lamp Selection -->
    <section>
        <h2>Lamp Selection</h2>

        <label>
            LED Type
            <select id="ledType">
                <option value="">Select LED Type</option>
            </select>
        </label>

        <label>
            Lamp Model
            <select id="lampModel">
                <option value="">Select Lamp Model</option>
            </select>
        </label>
    </section>


    <!-- Reflection -->
    <section>
        <h2>Reflection Factor</h2>

        <label>
            Ceiling
            <select id="ceilingReflection">
                <option value="80">80%</option>
                <option value="70">70%</option>
                <option value="50">50%</option>
                <option value="30">30%</option>
                <option value="10">10%</option>
                <option value="0">0%</option>
            </select>
        </label>

        <label>
            Wall
            <select id="wallReflection">
                <option value="70">70%</option>
                <option value="50">50%</option>
                <option value="30">30%</option>
                <option value="10">10%</option>
                <option value="0">0%</option>
            </select>
        </label>

        <label>
            Floor
            <select id="floorReflection">
                <option value="20">20%</option>
            </select>
        </label>
    </section>


    <!-- Target Lux -->
    <section>
        <h2>Target Illuminance</h2>

        <input
            type="number"
            id="targetLux"
            placeholder="Lux"
        >

        <button id="calculateButton">
            Calculate
        </button>
    </section>


    <!-- Result -->
    <section>
        <h2>Result</h2>

        <p>Room Area: <span id="areaResult">-</span> m²</p>
        <p>Room Index: <span id="roomIndexResult">-</span></p>
        <p>Efficiency: <span id="efficiencyResult">-</span></p>
        <p>Total Loss Factor: <span id="tlResult">-</span></p>
        <p>Required Flux: <span id="requiredFluxResult">-</span> lm</p>
        <p>Calculated Lamp Quantity: <span id="calculatedQuantityResult">-</span></p>
        <p>Fixed Lamp Quantity: <span id="fixedQuantityResult">-</span></p>
        <p>Actual Illuminance: <span id="actualLuxResult">-</span> lux</p>
        <p>Total Power: <span id="totalPowerResult">-</span> W</p>
    </section>


    <!-- DATABASE -->
    <script src="database/lamp_data.js"></script>
    <script src="database/eff_data.js"></script>

    <!-- CALCULATION LOGIC -->
    <script src="js/calculator.js"></script>

</body>
</html>
